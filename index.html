<form id="task-form">
    <input
        type="text"
        id="task-input"
        placeholder="What do you need to do?"
        maxlength="150"
        aria-label="New task"
        required
    >

    <button type="submit" class="add-button">Add Task</button>
</form>

<div class="search-container">
    <input
        type="search"
        id="search-input"
        placeholder="Search your tasks..."
        aria-label="Search tasks"
    >
</div>

<div class="filter-container" aria-label="Filter tasks">
    <button type="button" class="filter-button active" data-filter="all">All</button>
    <button type="button" class="filter-button" data-filter="active">Active</button>
    <button type="button" class="filter-button" data-filter="completed">Completed</button>
</div>

<p id="task-summary">0 tasks remaining</p>
<ul id="task-list"></ul>
<p id="empty-message">No tasks yet. Add your first task!</p>
